name: Beyond Forecast v0.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - run_active_event_intelligence_v01.py
      - test_run_active_event_intelligence_v01.py
      - build_active_ticket_event_matrix_v01.py
      - build_live_ticket_features_v01.py
      - build_beyond_forecast_v01.py
      - enrich_forecast_live_quality_v01.py
      - persist_forecast_observation_v01.py
      - .github/workflows/beyond-forecast-v01.yml
  push:
    branches:
      - main
    paths:
      - run_active_event_intelligence_v01.py
      - test_run_active_event_intelligence_v01.py
      - build_active_ticket_event_matrix_v01.py
      - build_live_ticket_features_v01.py
      - build_beyond_forecast_v01.py
      - enrich_forecast_live_quality_v01.py
      - persist_forecast_observation_v01.py
      - sql/snapshot_event_context_v01.sql
      - .github/workflows/beyond-forecast-v01.yml
  schedule:
    - cron: "35 * * * *"

concurrency:
  group: beyond-forecast-v01
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test live feature gap handling
        run: python test_live_ticket_features_v01.py

      - name: Test forecast live quality persistence
        run: python test_forecast_live_quality_v01.py

      - name: Test active event intelligence orchestration
        run: python test_run_active_event_intelligence_v01.py

  intelligence:
    needs: self-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EVENT_PROVIDER: "roboticket"
      EVENT_HOME_TEAM: "Lech Poznań"
      TOTAL_LEAGUE_MATCHES_PER_TEAM: "34"
      STADIUM_CAPACITY: "43269"
      EXPECTED_HOLDOUT_MAE: "5321.8"
      HOLDOUT_MAE_TOLERANCE: "50.0"
      TRANSIENT_JUMP_THRESHOLD: "500"
      TRANSIENT_RETURN_TOLERANCE: "100"
      SNAPSHOT_GAP_THRESHOLD_HOURS: "2.5"
      WINDOW_MAX_OVERSHOOT_HOURS: "2.5"
      MAX_LIVE_SNAPSHOT_AGE_MINUTES: "20"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn joblib

      - name: Build fresh live features and persist forecasts
        run: python run_active_event_intelligence_v01.py

      - name: Upload Beyond Forecast diagnostics
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beyond-forecast-v0-1
          path: |
            active_ticket_event_matrix.json
            live_ticket_artifacts_v01/
            beyond_forecast_artifacts_v01/
          retention-days: 7
