name: Collect Lech inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVENT_ID: "10234"
      EVENT_PROVIDER: "roboticket"
      EVENT_HOME_TEAM: "Lech Poznań"
      EVENT_AWAY_TEAM: "Jagiellonia Białystok"
      EVENT_COMPETITION: "Ekstraklasa"
      EVENT_MATCH_DATE: "2026-09-03"
      EVENT_KICKOFF_AT: "2026-09-03T20:30:00+02:00"
      EVENT_MAPPING_SOURCE: "fixture_schedule_update_2026-08-17"
      EVENT_MAPPING_CONFIDENCE: "high"
      ROBOTICKET_URL: "https://bilety.lechpoznan.pl/Stadium/Index?eventId=10234"

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      ROBOTICKET_USERNAME: ${{ secrets.ROBOTICKET_USERNAME }}
      ROBOTICKET_PASSWORD: ${{ secrets.ROBOTICKET_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect Lech Roboticket snapshot
        run: python collector.py
