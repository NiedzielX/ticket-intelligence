name: Ticket Intelligence Pipeline v0.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - collector.py
      - collect_discovered_events_v01.py
      - discover_roboticket_events_v01.py
      - apply_roboticket_event_overrides_v01.py
      - roboticket_event_overrides_v01.json
      - build_active_ticket_event_matrix_v01.py
      - build_live_ticket_features_v01.py
      - build_beyond_forecast_v01.py
      - enrich_forecast_live_quality_v01.py
      - persist_forecast_observation_v01.py
      - run_active_event_intelligence_v01.py
      - test_run_active_event_intelligence_v01.py
      - sql/snapshot_event_context_v01.sql
      - .github/workflows/collect-lech.yml
  push:
    branches:
      - main
    paths:
      - collector.py
      - collect_discovered_events_v01.py
      - discover_roboticket_events_v01.py
      - apply_roboticket_event_overrides_v01.py
      - roboticket_event_overrides_v01.json
      - build_active_ticket_event_matrix_v01.py
      - build_live_ticket_features_v01.py
      - build_beyond_forecast_v01.py
      - enrich_forecast_live_quality_v01.py
      - persist_forecast_observation_v01.py
      - run_active_event_intelligence_v01.py
      - test_run_active_event_intelligence_v01.py
      - sql/snapshot_event_context_v01.sql
      - .github/workflows/collect-lech.yml
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: lech-ticket-intelligence-${{ github.event_name == 'pull_request' && 'pr-validation' || 'production-v01' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate orchestration code
        run: |
          python test_run_active_event_intelligence_v01.py
          python -m py_compile \
            collector.py \
            collect_discovered_events_v01.py \
            discover_roboticket_events_v01.py \
            apply_roboticket_event_overrides_v01.py \
            run_active_event_intelligence_v01.py

  pipeline:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      EVENT_PROVIDER: "roboticket"
      EVENT_HOME_TEAM: "Lech Poznań"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ROBOTICKET_USERNAME: ${{ secrets.ROBOTICKET_USERNAME }}
      ROBOTICKET_PASSWORD: ${{ secrets.ROBOTICKET_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify snapshot schedule context migration
        run: |
          python - <<'PY'
          import os
          from urllib import request, error

          url = (
              os.environ['SUPABASE_URL'].rstrip('/')
              + '/rest/v1/snapshots?select=event_match_date_at_capture,event_kickoff_at_capture&limit=1'
          )
          key = os.environ['SUPABASE_SECRET_KEY']
          req = request.Request(url, headers={
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Accept': 'application/json',
          })
          try:
              with request.urlopen(req, timeout=30) as response:
                  print(f'snapshot schedule context schema probe: HTTP {response.status}')
          except error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')
              raise RuntimeError(
                  f'Apply sql/snapshot_event_context_v01.sql before enabling auto-onboarding. '
                  f'Supabase HTTP {exc.code}: {detail}'
              ) from exc
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy requests scikit-learn joblib

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Collect and forecast continuously
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ITERATIONS=1
          else
            ITERATIONS=60
          fi

          SUCCESSFUL_COLLECTIONS=0
          FAILED_COLLECTIONS=0
          INTELLIGENCE_ATTEMPTS=0
          SUCCESSFUL_INTELLIGENCE=0
          FAILED_INTELLIGENCE=0

          for ITERATION in $(seq 1 "$ITERATIONS"); do
            echo "=== Pipeline iteration $ITERATION/$ITERATIONS ==="
            COLLECTION_OK=0

            if python discover_roboticket_events_v01.py \
              && python apply_roboticket_event_overrides_v01.py \
              && python collect_discovered_events_v01.py; then
              SUCCESSFUL_COLLECTIONS=$((SUCCESSFUL_COLLECTIONS + 1))
              COLLECTION_OK=1
            else
              FAILED_COLLECTIONS=$((FAILED_COLLECTIONS + 1))
              echo "::warning::Collection iteration $ITERATION failed; continuing with the next sample."
            fi

            if [ "$COLLECTION_OK" -eq 1 ] \
              && { [ "$ITERATION" -eq 1 ] || [ $(( (ITERATION - 1) % 12 )) -eq 0 ]; }; then
              INTELLIGENCE_ATTEMPTS=$((INTELLIGENCE_ATTEMPTS + 1))
              echo "=== Fresh-snapshot intelligence cycle ==="

              if python run_active_event_intelligence_v01.py; then
                SUCCESSFUL_INTELLIGENCE=$((SUCCESSFUL_INTELLIGENCE + 1))
              else
                FAILED_INTELLIGENCE=$((FAILED_INTELLIGENCE + 1))
                echo "::warning::Intelligence cycle failed; inventory collection will continue."
              fi
            fi

            if [ "$ITERATION" -lt "$ITERATIONS" ]; then
              sleep 300
            fi
          done

          echo "Successful collections: $SUCCESSFUL_COLLECTIONS"
          echo "Failed collections: $FAILED_COLLECTIONS"
          echo "Intelligence attempts: $INTELLIGENCE_ATTEMPTS"
          echo "Successful intelligence cycles: $SUCCESSFUL_INTELLIGENCE"
          echo "Failed intelligence cycles: $FAILED_INTELLIGENCE"

          if [ "$SUCCESSFUL_COLLECTIONS" -eq 0 ]; then
            echo "::error::No collection iteration succeeded."
            exit 1
          fi

          if [ "$INTELLIGENCE_ATTEMPTS" -gt 0 ] && [ "$SUCCESSFUL_INTELLIGENCE" -eq 0 ]; then
            echo "::error::Collection succeeded, but no intelligence cycle succeeded."
            exit 1
          fi

      - name: Upload pipeline diagnostics
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ticket-intelligence-pipeline
          path: |
            roboticket_discovery_artifacts_v01/
            collector_results_v01/
            live_ticket_artifacts_v01/
            beyond_forecast_artifacts_v01/
          retention-days: 3
