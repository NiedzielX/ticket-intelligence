name: Collect Lech inventory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/auto-event-onboarding-v01
    paths:
      - collector.py
      - collect_discovered_events_v01.py
      - discover_roboticket_events_v01.py
      - sql/snapshot_event_context_v01.sql
      - .github/workflows/collect-lech.yml
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ROBOTICKET_USERNAME: ${{ secrets.ROBOTICKET_USERNAME }}
      ROBOTICKET_PASSWORD: ${{ secrets.ROBOTICKET_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify snapshot schedule context migration
        run: |
          python - <<'PY'
          import os
          from urllib import request, error

          url = (
              os.environ['SUPABASE_URL'].rstrip('/')
              + '/rest/v1/snapshots?select=event_match_date_at_capture,event_kickoff_at_capture&limit=1'
          )
          key = os.environ['SUPABASE_SECRET_KEY']
          req = request.Request(url, headers={
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Accept': 'application/json',
          })
          try:
              with request.urlopen(req, timeout=30) as response:
                  print(f'snapshot schedule context schema probe: HTTP {response.status}')
          except error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')
              raise RuntimeError(
                  f'Apply sql/snapshot_event_context_v01.sql before enabling auto-onboarding. '
                  f'Supabase HTTP {exc.code}: {detail}'
              ) from exc
          PY

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Discover active Lech Roboticket events
        run: python discover_roboticket_events_v01.py

      - name: Collect discovered events
        run: python collect_discovered_events_v01.py

      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lech-inventory-collection
          path: |
            roboticket_discovery_artifacts_v01/
            collector_results_v01/
          retention-days: 14
