name: Collect Lech inventory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - collector.py
      - collect_discovered_events_v01.py
      - discover_roboticket_events_v01.py
      - sql/snapshot_event_context_v01.sql
      - .github/workflows/collect-lech.yml
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: lech-inventory-continuous
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ROBOTICKET_USERNAME: ${{ secrets.ROBOTICKET_USERNAME }}
      ROBOTICKET_PASSWORD: ${{ secrets.ROBOTICKET_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify snapshot schedule context migration
        run: |
          python - <<'PY'
          import os
          from urllib import request, error

          url = (
              os.environ['SUPABASE_URL'].rstrip('/')
              + '/rest/v1/snapshots?select=event_match_date_at_capture,event_kickoff_at_capture&limit=1'
          )
          key = os.environ['SUPABASE_SECRET_KEY']
          req = request.Request(url, headers={
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Accept': 'application/json',
          })
          try:
              with request.urlopen(req, timeout=30) as response:
                  print(f'snapshot schedule context schema probe: HTTP {response.status}')
          except error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')
              raise RuntimeError(
                  f'Apply sql/snapshot_event_context_v01.sql before enabling auto-onboarding. '
                  f'Supabase HTTP {exc.code}: {detail}'
              ) from exc
          PY

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Collect active Lech Roboticket events continuously
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ITERATIONS=1
          else
            ITERATIONS=60
          fi

          SUCCESSFUL_ITERATIONS=0
          FAILED_ITERATIONS=0

          for ITERATION in $(seq 1 "$ITERATIONS"); do
            echo "=== Collector iteration $ITERATION/$ITERATIONS ==="

            if python discover_roboticket_events_v01.py && python collect_discovered_events_v01.py; then
              SUCCESSFUL_ITERATIONS=$((SUCCESSFUL_ITERATIONS + 1))
            else
              FAILED_ITERATIONS=$((FAILED_ITERATIONS + 1))
              echo "::warning::Collector iteration $ITERATION failed; continuing with the next sample."
            fi

            if [ "$ITERATION" -lt "$ITERATIONS" ]; then
              sleep 300
            fi
          done

          echo "Successful iterations: $SUCCESSFUL_ITERATIONS"
          echo "Failed iterations: $FAILED_ITERATIONS"

          if [ "$SUCCESSFUL_ITERATIONS" -eq 0 ]; then
            echo "::error::No collector iteration succeeded."
            exit 1
          fi

      - name: Upload collection diagnostics
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lech-inventory-collection
          path: |
            roboticket_discovery_artifacts_v01/
            collector_results_v01/
          retention-days: 3
