name: Collect Lech inventory

on:
  workflow_dispatch:
  push:
    branches:
      - agent/event-metadata-v01
    paths:
      - collector.py
      - .github/workflows/collect-lech.yml
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        event:
          - id: "10069"
            provider: "roboticket"
            home_team: "Lech Poznań"
            away_team: "Jagiellonia Białystok"
            competition: "Ekstraklasa"
            match_date: "2026-09-03"
            kickoff_at: "2026-09-03T20:30:00+02:00"
            mapping_source: "fixture_schedule_update_2026-08-17"
            mapping_confidence: "high"
            url: "https://bilety.lechpoznan.pl/Stadium/Index?eventId=10069"

          - id: "10102"
            provider: "roboticket"
            home_team: "Lech Poznań"
            away_team: "Thun"
            competition: "UEFA Europa League"
            match_date: "2026-08-20"
            kickoff_at: "2026-08-20T19:00:00+02:00"
            mapping_source: "fixture_schedule_update_2026-08-17"
            mapping_confidence: "high"
            url: "https://bilety.lechpoznan.pl/Stadium?eventId=10102"

    env:
      EVENT_ID: ${{ matrix.event.id }}
      EVENT_PROVIDER: ${{ matrix.event.provider }}
      EVENT_HOME_TEAM: ${{ matrix.event.home_team }}
      EVENT_AWAY_TEAM: ${{ matrix.event.away_team }}
      EVENT_COMPETITION: ${{ matrix.event.competition }}
      EVENT_MATCH_DATE: ${{ matrix.event.match_date }}
      EVENT_KICKOFF_AT: ${{ matrix.event.kickoff_at }}
      EVENT_MAPPING_SOURCE: ${{ matrix.event.mapping_source }}
      EVENT_MAPPING_CONFIDENCE: ${{ matrix.event.mapping_confidence }}
      ROBOTICKET_URL: ${{ matrix.event.url }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      ROBOTICKET_USERNAME: ${{ secrets.ROBOTICKET_USERNAME }}
      ROBOTICKET_PASSWORD: ${{ secrets.ROBOTICKET_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect Lech Roboticket snapshot
        run: python collector.py
