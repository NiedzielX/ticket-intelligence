name: Build Lech Demand Model v1.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn joblib

      - name: Build clean Lech demand dataset
        run: python build_lech_demand_dataset_v11.py

      - name: Train Lech Demand Model v1.1
        run: python train_lech_demand_model_v11.py

      - name: Upload model and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lech-demand-model-v1-1
          path: lech_demand_artifacts_v1/
          retention-days: 30
