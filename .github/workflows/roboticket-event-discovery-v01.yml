name: Roboticket Event Discovery v0.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - discover_roboticket_events_v01.py
      - .github/workflows/roboticket-event-discovery-v01.yml
  push:
    branches:
      - agent/auto-event-onboarding-v01
    paths:
      - discover_roboticket_events_v01.py
      - .github/workflows/roboticket-event-discovery-v01.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Discover Roboticket events
        run: python discover_roboticket_events_v01.py

      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboticket-event-discovery-v0-1
          path: roboticket_discovery_artifacts_v01/
          retention-days: 7
